[build-system]
requires = [
    "build",
    "wheel",
    "scikit-build-core>=0.3.3",
    "pybind11",
    "cmake",
    "ninja",
    "pin==3.7.0; sys_platform != 'win32' and platform_python_implementation == 'CPython'",
]
build-backend = "scikit_build_core.build"

[project]
name = "frankik"
version = "1.0.1"
description = "Standalone blazing fast, analytical inverse kinematics for Franka Panda and FR3 robots plus a generic numerical (Pinocchio) solver for any MJCF robot."
readme = "README.md"
dependencies = [
    "numpy",
]
maintainers = [
  { name = "Tobias Jülg", email = "tobias@juelg.net" },
]
authors = [
  { name = "Tobias Jülg", email = "tobias@juelg.net" },
]
requires-python = ">=3.10"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/juelg/frankik"
Issues = "https://github.com/juelg/frankik/issues"

[project.optional-dependencies]
# pin version must match build-system.requires, cmeel-* pins are needed by pin 3.7.0 at runtime
pinocchio = [
    "pin==3.7.0",
    "cmeel-urdfdom<5",
    "cmeel-tinyxml2<11",
]
dev = [
    "pin==3.7.0",
    "cmeel-urdfdom<5",
    "cmeel-tinyxml2<11",
    "ruff==0.3.2",
    "black==24.1.1",
    "isort==5.13.2",
    "mypy==1.10.1",
    "types-requests~=2.31",
    "pybind11-stubgen==2.5.5",
    "pytest==8.1.1",
    "commitizen~=3.28.0",
    "clang",
    "clang-format",
    "clang-tidy",
    "scipy",
    "mujoco",
]

[tool.scikit-build]
build.verbose = true
logging.level = "INFO"
build-dir = "build"
wheel.packages = ["src/frankik"]
install.components = ["python_package"]
cmake.build-type = "Release"

# pin ships manylinux_2_28 wheels for CPython on Linux and macOS >= 11 only. Its libraries are a runtime
# dependency (frankik[pinocchio]) and therefore excluded from the wheel repair.
[tool.cibuildwheel]
skip = ["pp*", "*-musllinux*"]
environment = { CMAKE_ARGS = "-DFRANKIK_WITH_PINOCCHIO=ON" }

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
repair-wheel-command = "auditwheel repair -w {dest_dir} {wheel} --exclude libpinocchio_default.so.3.7.0 --exclude libpinocchio_parsers.so.3.7.0"

[tool.cibuildwheel.macos]
environment = { CMAKE_ARGS = "-DFRANKIK_WITH_PINOCCHIO=ON", MACOSX_DEPLOYMENT_TARGET = "11.0" }
repair-wheel-command = "delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel} --exclude libpinocchio_default --exclude libpinocchio_parsers"

[tool.cibuildwheel.windows]
environment = { CMAKE_ARGS = "-DFRANKIK_WITH_PINOCCHIO=OFF" }

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.isort]
profile = "black"

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true
pretty = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-vv"
testpaths = [
    "src/tests",
]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "pep440"
version_provider = "pep621"
update_changelog_on_bump = true
version_files = [
    "CMakeLists.txt:VERSION",
    "src/frankik/_core.pyi:__version__",
    "src/frankik/_pin.pyi:__version__",
]