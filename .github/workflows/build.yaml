name: Python
on:
  workflow_call:
  pull_request:
    paths:
      - "src/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - "pyproject.toml"
      - "Makefile"
      - ".github/workflows/**"
  push:
    branches:
      - main

jobs:
  build_clang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install Pinocchio (cmeel wheel) for the numerical solver
        run: python -m pip install "pin==3.7.0" "cmeel-urdfdom<5" "cmeel-tinyxml2<11"
      - name: Check clang format
        run: make cppcheckformat
      - name: Clang build
        run: make clangcompile WITH_PINOCCHIO=ON PYTHON_EXECUTABLE=${{ steps.setup-python.outputs.python-path }}

  pythonpackage:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # fail the build instead of silently dropping the Pinocchio module
      CMAKE_ARGS: -DFRANKIK_WITH_PINOCCHIO=ON
      FRANKIK_REQUIRE_PINOCCHIO: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install the package
        run: python -m pip install '.[dev]'
      - name: Code formatting
        run: make pycheckformat
      - name: Code linting
        run: make pylint
      - name: Check that stub files are up-to-date
        run: make stubgen && git diff --exit-code
      - name: Ensure all unittests(pytest) are passing
        run: make pytest

  pythonpackage_without_pinocchio:
    # the analytical solver must keep working without the optional pinocchio dependency (e.g. on Windows)
    runs-on: ubuntu-latest
    env:
      CMAKE_ARGS: -DFRANKIK_WITH_PINOCCHIO=OFF
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install the package
        run: python -m pip install . pytest scipy
      - name: Ensure the numerical solver reports itself as unavailable
        run: |
          python -c "import frankik, sys; sys.exit(0 if not frankik.has_pinocchio() else 'pinocchio should not be available')"
      - name: Ensure all unittests(pytest) are passing
        run: make pytest
